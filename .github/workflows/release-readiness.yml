name: Release readiness

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  readiness:
    if: github.repository == 'adobe/aio-cli-plugin-aem-edge-functions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Check the release PR against current main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
        run: node .github/scripts/release.js check
