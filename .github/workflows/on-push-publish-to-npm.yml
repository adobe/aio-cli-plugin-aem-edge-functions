name: on-push-publish-to-npm
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged release PR number to resume
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: release-automation
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'adobe/aio-cli-plugin-aem-edge-functions' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Preserve the publisher from the workflow commit
        run: cp .github/scripts/release.js "$RUNNER_TEMP/release-publisher.js"
      - name: Validate the merged release and select its exact commit
        id: release
        run: node "$RUNNER_TEMP/release-publisher.js" select
      - if: steps.release.outputs.skip != 'true'
        run: npm ci
      - if: steps.release.outputs.skip != 'true'
        run: npx eslint .github/scripts/release.js
      - if: steps.release.outputs.skip != 'true'
        run: npm test
      - name: Publish the release to GitHub and npm
        if: steps.release.outputs.skip != 'true'
        run: node "$RUNNER_TEMP/release-publisher.js" publish
